[package]
name = "etornie-attestation"
version = "0.1.0"
description = "Case lifecycle compressed attestations for Etornie"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "etornie_attestation"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
