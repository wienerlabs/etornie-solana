name: backend-test

# Runs the FastAPI test suite (services/api). Tests use an in-memory SQLite
# database (see tests/conftest.py) but require a Redis instance on port 6380
# for the OTP / rate-limit modules, provided here as a service container.

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend-test.yml"

concurrency:
  group: backend-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    services:
      redis:
        image: redis:7-alpine
        ports:
          # conftest.py hardcodes redis://localhost:6380/1
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -q
