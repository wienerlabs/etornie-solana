[project]
name = "etornie-backend"
version = "0.1.0"
description = "Backend API for Etornie — IP and patent services platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<6.0.0",
    "httpx>=0.28.0",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.0.0",
    "redis>=5.0.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "pynacl>=1.5.0",
    "base58>=2.1.1",
    "solana>=0.34.0",
    "solders>=0.21.0",
    "playwright>=1.48.0",
    "together>=1.3.0",
    "reportlab>=4.2.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "stripe>=11.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure-Python unit tests with no I/O",
    "integration: tests that exercise the database or HTTP stack",
]
