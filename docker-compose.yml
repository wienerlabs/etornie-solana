services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: etornie
      POSTGRES_PASSWORD: etornie_dev
      POSTGRES_DB: etornie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etornie -d etornie"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
