name: etornie-solana

services:
  etornie-solana-db:
    image: pgvector/pgvector:pg16
    container_name: etornie-solana-db
    environment:
      POSTGRES_USER: etornie_solana
      POSTGRES_PASSWORD: etornie_solana_dev
      POSTGRES_DB: etornie_solana
    ports:
      - "5433:5432"
    volumes:
      - etornie_solana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etornie_solana -d etornie_solana"]
      interval: 5s
      timeout: 5s
      retries: 5

  etornie-solana-redis:
    image: redis:7-alpine
    container_name: etornie-solana-redis
    ports:
      - "6380:6379"
    volumes:
      - etornie_solana_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  etornie-solana-app:
    build: .
    container_name: etornie-solana-app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      etornie-solana-db:
        condition: service_healthy
      etornie-solana-redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  etornie_solana_pgdata:
  etornie_solana_redisdata:
